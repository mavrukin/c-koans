name: koans

on:
  push:
  pull_request:

# The koans target ISO C23 strictly: __STDC_VERSION__ must be 202311L, the
# ratified value. Compilers that shipped C23 before ratification report the
# draft 202000L and are not supported — GCC 14 is the notable one.
#
# Track the newest released compilers rather than the oldest that might work.
# ubuntu-26.04 preinstalls Clang 20/21/22 and GCC 15; GCC 16 is one apt install
# away in universe. macOS installs LLVM from Homebrew because Xcode's Clang
# lags upstream.

jobs:
  solutions:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, name: "linux / gcc-16",   cc: gcc-16,   apt: gcc-16 }
          - { os: ubuntu-26.04, name: "linux / clang-22", cc: clang-22, apt: "" }
          - { os: macos-15,     name: "macos / clang",    cc: clang,    apt: "", brew: true }

    env:
      CC: ${{ matrix.cc }}

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler from apt
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Install LLVM from Homebrew
        if: matrix.brew
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # Fail loudly and early if the compiler is too old, rather than letting
      # a koan fail later with a confusing message.
      - name: Compiler reports ratified C23
        run: |
          $CC --version
          version=$($CC -std=c23 -dM -E -x c /dev/null | awk '/__STDC_VERSION__/ {print $3}')
          echo "__STDC_VERSION__ = $version"
          case "$version" in
            202311L) echo "ratified C23: ok" ;;
            *) echo "::error::$CC reports $version; these koans require 202311L"; exit 1 ;;
          esac

      - name: koans/ is in sync with solutions/
        run: python3 tools/genkoans.py --check

      # The koans create scratch files while they run, and a koan that fails
      # jumps out before its cleanup. Committing one of those breaks a fresh
      # clone: a koan that expects to create a file finds it already there.
      - name: No scratch artifacts committed
        run: |
          if git ls-files | grep -qE '^koan_|\.tmp$'; then
            echo "::error::scratch files are committed; they break a fresh clone"
            git ls-files | grep -E '^koan_|\.tmp$'
            exit 1
          fi
          echo "no scratch files tracked: ok"

      - name: Reference solutions all pass
        run: make check

      - name: Solutions build without warnings
        run: |
          make clean
          # Outside the repo, so it cannot be mistaken for a stray artifact by
          # the working-tree check below.
          log="$RUNNER_TEMP/build.log"
          make check 2>&1 | tee "$log"
          if grep -qiE '\bwarning\b' "$log"; then
            echo "::error::the solutions must build without warnings"
            grep -iE '\bwarning\b' "$log"
            exit 1
          fi

      # A successful run must be a no-op on the working tree. This is also how
      # the koans prove they are idempotent: run twice, still clean.
      - name: Koans leave the working tree clean
        run: |
          make clean
          make check
          make check
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::running the koans left files behind"
            git status --porcelain
            exit 1
          fi
          echo "working tree clean after two runs: ok"

      - name: Solutions pass under sanitizers
        run: |
          make clean
          make san-check

      # Two separate assertions, deliberately. If this were a single "does
      # make fail?" check, a compile error in koans/ would be indistinguishable
      # from "the koans are unsolved" — and a generator bug could ship koans
      # that already pass. The build must succeed; only the run may fail.
      - name: Unsolved koans compile, then fail
        run: |
          make clean
          make build/bin/koans
          make check-unsolved

      - name: Capstone projects build
        run: make -C projects all

      - name: Capstone library self-checks
        run: make -C projects check

      - name: Capstone self-checks under sanitizers
        run: make -C projects san

      - name: Web server serves, and refuses traversal
        run: |
          make -C projects all
          ./projects/build/koanhttpd --port 8137 --root projects/webserver/www &
          SERVER_PID=$!
          sleep 2
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8137/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8137/cgi-bin/env.cgi)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8137/nope)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is http://127.0.0.1:8137/%2e%2e%2fMakefile)" = 404
          echo "web server: ok"
          kill "$SERVER_PID"
